name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze application
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test offline voice parser
        run: flutter test test/voice/local_alarm_parser_test.dart

      - name: Configure permanent release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/app/release-key.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
          } > android/key.properties

      - name: Build universal release APK
        run: flutter build apk --release --flavor prod

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          apk_path="$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*release.apk' | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" "Alarm-${GITHUB_REF_NAME}.apk"
          sha256sum "Alarm-${GITHUB_REF_NAME}.apk" > "Alarm-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Alarm-${GITHUB_REF_NAME}.apk" \
            "Alarm-${GITHUB_REF_NAME}.apk.sha256" \
            --verify-tag \
            --title "Alarm ${GITHUB_REF_NAME}" \
            --notes "Installable universal Android APK for Alarm ${GITHUB_REF_NAME}."
