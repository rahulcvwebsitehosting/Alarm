name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build universal release APK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          flutter build apk
          --release
          --flavor prod
          --dart-define=OPENROUTER_API_KEY="$OPENROUTER_API_KEY"

      - name: Prepare release asset
        shell: bash
        run: |
          apk_path="$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*release.apk' | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" "Alarm-${GITHUB_REF_NAME}.apk"
          sha256sum "Alarm-${GITHUB_REF_NAME}.apk" > "Alarm-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Alarm-${GITHUB_REF_NAME}.apk" \
            "Alarm-${GITHUB_REF_NAME}.apk.sha256" \
            --verify-tag \
            --title "Alarm ${GITHUB_REF_NAME}" \
            --notes "Installable universal Android APK for Alarm ${GITHUB_REF_NAME}."
